apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edu-rag-bot-ingress
  namespace: edu-rag-bot
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: rag.weiye.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: edu-rag-bot 
            port:
              number: 80     
